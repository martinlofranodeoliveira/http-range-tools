name: public checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure bubblewrap exists on this ephemeral runner
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
      - name: Isolated tests and examples
        run: python checks-offline.py
      - name: Build and stage the package on this ephemeral runner
        run: |
          python -m pip install --upgrade setuptools wheel
          wheel_dir=$(mktemp -d "$RUNNER_TEMP/http-range-tools-wheel.XXXXXX")
          package_dir=$(mktemp -d "$RUNNER_TEMP/http-range-tools-package.XXXXXX")
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$wheel_dir" .
          python -m pip install --no-deps --no-compile --target "$package_dir" "$wheel_dir"/*.whl
          python checks-offline.py --installed-package "$package_dir"
